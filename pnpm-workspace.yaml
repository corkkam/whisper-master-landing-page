# Security overrides: force patched versions of transitive deps that ship
# inside `next` and cannot be bumped by upgrading Next alone.
#   postcss <8.5.18 — sourceMappingURL path traversal / arbitrary .map read
#                     (GHSA-r28c-9q8g-f849, GHSA-6g55-p6wh-862q) + </style> XSS
#   sharp   <0.35.5 — inherited libvips CVEs (2026-33327/33328/35590/35591),
#                     GHSA-rgj7-g3m4-5g8c, GHSA-wq5f-xc86-pv6w
#   source-map-js <1.2.2 — GHSA-68fv-2mgg-jv7q, reached via next > postcss
#   nanoid  <3.3.18 — infinite loop when a custom generator is given size zero
#                     (GHSA-2v37-7h3g-55p8), reached only via next > postcss > nanoid
#   build-time only (Tailwind / browserslist chain, never shipped to the client):
#   postcss-selector-parser <7.1.6 — quadratic flat-selector parsing (CPU DoS)
#   browserslist <4.28.7 — crash / prototype write via custom stats json
#   baseline-browser-mapping <2.11.0 — process exit on invalid input
overrides:
  postcss@<8.5.18: '>=8.5.18'
  sharp@<0.35.5: '>=0.35.5'
  source-map-js@<1.2.2: '>=1.2.2'
  nanoid@<3.3.18: '>=3.3.18'
  postcss-selector-parser@<7.1.6: '>=7.1.6'
  browserslist@<4.28.7: '>=4.28.7'
  baseline-browser-mapping@<2.11.0: '>=2.11.0'
