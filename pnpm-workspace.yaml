# Security overrides: force patched versions of transitive deps that ship
# inside `next` and cannot be bumped by upgrading Next alone.
#   postcss <8.5.18 — sourceMappingURL path traversal / arbitrary .map read
#                     (GHSA-r28c-9q8g-f849, GHSA-6g55-p6wh-862q) + </style> XSS
#   sharp   <0.35.0 — inherited libvips CVEs (2026-33327/33328/35590/35591)
#   nanoid  <3.3.18 — infinite loop when a custom generator is given size zero
#                     (GHSA-2v37-7h3g-55p8), reached only via next > postcss > nanoid
overrides:
  postcss@<8.5.18: '>=8.5.18'
  sharp@<0.35.0: '>=0.35.0'
  nanoid@<3.3.18: '>=3.3.18'
