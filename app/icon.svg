<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Whisper Master favicon — the nav brand mark (`LevelMark` in Wordmark.tsx): a
    mic level meter, four bars at 44/100/66/28 of full height. The last bar is
    `signal` while the rest are `ember`, which is the palette's whole argument in
    one glyph: your voice on the left, the machine's output on the right.
    Bar geometry is kept chunky on purpose so it survives a 16px tab strip.
  -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="104%" r="78%">
      <stop offset="0%" stop-color="#ff6a3d" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ff6a3d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#07090e" />
  <rect width="64" height="64" rx="14" fill="url(#glow)" />

  <g fill="#ff6a3d">
    <rect x="13.25" y="24" width="6" height="16" rx="3" />
    <rect x="23.75" y="14" width="6" height="36" rx="3" />
    <rect x="34.25" y="20" width="6" height="24" rx="3" />
  </g>
  <rect x="44.75" y="27" width="6" height="10" rx="3" fill="#6ee7df" />
</svg>
